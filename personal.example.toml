# Example personal settings for BalancePoint.
#
# Copy this file to data/personal.toml and edit it. The examples are commented out (# at the start of the
# line): copied as-is, it changes nothing. Remove the # from the lines you want. data/ is git-ignored, so
# nothing you put in personal.toml ends up in the code repository. The app reads it at startup; restart after editing.
# Anything you change on the Merchant dictionary page in the app wins over this file.

# ------------------------------------------------------------------ optional features
# Leave a feature out and the app decides: each is on once it's in use (so an install that uses it
# keeps it) and off for a new one. Set it to switch it on or off for good.
#   blackjack: the Bankroll page; on once there are blackjack sessions.
#   business:  the Business page (income, costs and profit per business account); on once an account
#              has its own categories (Accounts -> Business accounts, which is always there to set one up).

[features]
blackjack = false
# business = true

# ------------------------------------------------------------------ notifications (optional)
# A short message after the scheduled bank sync (README: "Notifications (optional)"). Leave this section
# out and nothing is ever sent. Try it with: run.py notify-test
#   when:   "warnings" (only with pace/cushion warnings, stale accounts or sync errors; the default),
#           "daily" (after every sync), or "monthly" (on the 1st: last month's result and this month's start)
#   method: "email" or "ntfy"
#   app_url: optional link to the app, added at the end of each message

# [notify]
# when = "warnings"
# method = "email"
# smtp_host = "smtp.gmail.com"
# smtp_port = 587                # 587 = STARTTLS (default), 465 = SSL
# smtp_user = "you@gmail.com"    # the password is NOT here: run.py notify-setup-password
# from = "you@gmail.com"         # default: smtp_user
# to = ["you@gmail.com", "partner@example.com"]
# app_url = "http://your-mac:5000"

# Or a phone notification by ntfy (ntfy.sh or your own server). Anyone who knows an ntfy.sh topic can
# read it, so make the topic long and random:
# [notify]
# method = "ntfy"
# ntfy_url = "https://ntfy.sh/budget-7f3k9q2x8w4m1z6v"

# ------------------------------------------------------------------ extra categories
# kind is expense, income or transfer (transfers aren't counted as income or spending).

# [[category]]
# name = "Garden"
# kind = "expense"

# ------------------------------------------------------------------ merchants
# match:    text found in the bank's description (capitals don't matter; prefix with re: for a regex)
# name:     how it shows up in the app
# category: where it goes
# name or category can be left out.

# [[merchant]]
# match = "MAPLE STREET BAKERY"
# name = "Maple Street Bakery"
# category = "Dining & Drinks"

# [[merchant]]
# match = "ACME CORP PAYROLL"
# name = "Paycheck"
# category = "Paycheck"

# amount matches only that exact amount, for a deposit that's always the same, like rent.
# [[merchant]]
# match = "CASH APP"
# amount = 950
# name = "Rent"
# category = "Rental Income"

# ------------------------------------------------------------------ category keywords
# A word in the cleaned-up merchant name -> category.

# [keywords]
# "Nursery" = "Garden"

# ------------------------------------------------------------------ old budget spreadsheet (optional)
# Tells Upload data -> Old budget workbook how to read a hand-kept budget spreadsheet.
# Leave this whole section out if you don't have one.

# [spreadsheet]
# A daily ledger sheet. Its top rows are a legend: "<Mon YYYY> - ..." in column A, then headers
# like "Checking Income | Item" over each amount/name column pair, used from that month on.
# ledger_sheet = "Budget"
# Sheets holding a US Bank export (Date, Transaction, Name, Memo, Amount) plus your own name for
# each charge in name_column. Used to learn merchant names.
# name_sheets = ["Card Export"]
# name_column = "G"
# investments_sheet = "Investments"

# Ledger column header (the part before "| Item") -> account
# [spreadsheet.ledger_accounts]
# "Checking Income" = { account = "Checking", kind = "checking" }
# "Checking Cost" = { account = "Checking", kind = "checking" }
# "Credit Cost" = { account = "Credit Card", kind = "credit" }

# Running balance column headers in the legend rows -> account
# [spreadsheet.balance_columns]
# "Checking Balance" = { account = "Checking", kind = "checking" }
# "Card Balance" = { account = "Credit Card", kind = "credit" }

# Label anywhere right of the ledger -> account; the value is in the cell to its left
# [spreadsheet.panel_accounts]
# "401k" = { account = "401k", kind = "retirement" }
# "Home Loan" = { account = "Mortgage", kind = "loan" }

# Summary label with a =SUM(...) formula right below it -> category.
# also_ok: categories the automatic rules may keep instead.
# only_if_uncategorized: use the label only when nothing else categorized the transaction.
# [spreadsheet.category_labels]
# "Food" = { category = "Dining & Drinks", also_ok = ["Groceries"] }
# "Misc" = { category = "Other", only_if_uncategorized = true }

# Investments sheet: a section title alone on its row -> account, and the column holding values
# [spreadsheet.investments]
# "Brokerage" = { account = "Brokerage", kind = "brokerage", column = "E" }

# Account kinds: checking, savings, cash, brokerage, retirement, hsa, crypto, property, vehicle,
# other, held (a child's 529 or other money you track but don't own), credit, loan, other_debt
