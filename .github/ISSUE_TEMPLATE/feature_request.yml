name: Feature request
description: Suggest something new or better
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Examples should use made-up data (Pat Smith, ACME CORP), never your real finances.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no real personal or financial data.
          required: true
