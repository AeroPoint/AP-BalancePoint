name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      # Personal data must never be committed.
      - name: No personal data in the repo
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)data/|\.db$|\.sqlite3$|\.xlsx?$|\.csv$|simplefin-access-url'; then
            echo "Personal data files are tracked"; exit 1
          fi
