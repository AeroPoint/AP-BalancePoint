name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      # Personal data must never be committed: data files, databases, spreadsheets, CSVs,
      # access URLs or secret-looking strings (see scripts/check_no_personal_data.py).
      - name: No personal data in the repo
        run: python scripts/check_no_personal_data.py
